name: Fix MD Newlines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run fix script
        run: python fix_md_newlines.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "fix: correct line breaks in directory md files"
          file_pattern: '*/*.md'
          skip_dirty_check: false
