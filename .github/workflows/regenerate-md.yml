name: Regenerate MD Files from Folder Names

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run regeneration script
        run: python regenerate_md.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "fix: regenerate md files with correct line breaks"
          file_pattern: '*/*.md'
          skip_dirty_check: false
